<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容管理 · 模型手记</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body[data-page="admin"] { background: var(--paper); }

    .admin-shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* ---------- 左侧模块栏 ---------- */
    .admin-side {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 26px 20px 20px;
      overflow-y: auto;
      background: var(--paper);
      border-top: 3px solid var(--accent);
      border-right: 1px solid var(--line);
    }

    .admin-side .brand { margin-bottom: 4px; }

    .admin-side-label {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .admin-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .admin-nav button {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 2px 8px;
      width: 100%;
      padding: 11px 12px;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .admin-nav button:hover { background: var(--paper-deep); }

    .admin-nav button.is-active {
      background: var(--paper-deep);
      border-color: var(--line);
    }

    .admin-nav-no {
      grid-row: span 2;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.6;
    }

    .admin-nav strong {
      font-size: 13.5px;
      font-weight: 600;
    }

    .admin-nav small {
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.4;
    }

    .admin-nav button.is-active strong,
    .admin-nav button.is-active .admin-nav-no { color: var(--accent); }

    body:not(.is-authed) .admin-nav button { opacity: 0.55; }

    .admin-side-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px 12px;
      background: var(--paper-card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .admin-side-stats div { display: flex; flex-direction: column; }
    .admin-side-stats b { font-family: var(--mono); font-size: 18px; line-height: 1.2; }
    .admin-side-stats span { color: var(--muted); font-size: 10.5px; }

    .admin-side-foot {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11.5px;
    }

    .admin-side-foot a { padding: 4px 0; }
    .admin-side-foot a:hover { color: var(--accent); }

    .admin-side-foot button {
      padding: 6px 0;
      text-align: left;
      color: var(--accent);
      background: transparent;
      border: 0;
      font-family: var(--mono);
      font-size: 11.5px;
    }

    /* ---------- 右侧内容区 ---------- */
    .admin-main {
      width: 100%;
      max-width: 1120px;
      padding: 38px clamp(24px, 4vw, 56px) 80px;
    }

    .admin-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .admin-head h1 { margin: 8px 0 6px; font-family: var(--serif); font-size: 32px; }
    .admin-head p { margin: 0; color: var(--muted); }

    .admin-badge {
      flex: 0 0 auto;
      padding: 5px 10px;
      color: var(--accent);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.06em;
    }

    .admin-card {
      padding: 22px;
      margin-bottom: 18px;
      background: var(--paper-card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .admin-card[hidden] { display: none; }
    .admin-workspace[hidden] { display: none; }

    .admin-card h2 { margin: 0 0 14px; font-family: var(--serif); font-size: 20px; }

    .admin-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .admin-section-head h2 { margin: 0; }
    .admin-section-head span { color: var(--muted); font-size: 11.5px; }

    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .admin-field { display: flex; flex-direction: column; gap: 5px; color: var(--muted); font-size: 12px; }
    .admin-field.full { grid-column: 1 / -1; }

    .admin-field input,
    .admin-field textarea,
    .admin-field select {
      width: 100%;
      padding: 9px 10px;
      color: var(--ink);
      background: #fffefb;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }

    .admin-field textarea { min-height: 76px; resize: vertical; line-height: 1.6; }
    .admin-field textarea.content { min-height: 240px; font-family: var(--mono); font-size: 12px; }

    .admin-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }

    .admin-btn {
      padding: 8px 13px;
      color: #fffdf8;
      background: var(--ink);
      border: 1px solid var(--ink);
      border-radius: 8px;
      font-size: 12px;
    }

    .admin-btn.ghost { color: var(--ink); background: transparent; }
    .admin-btn.danger { background: #a83a24; border-color: #a83a24; }
    .admin-status { margin-left: 6px; color: var(--muted); font-size: 12px; }

    .admin-project { padding-top: 14px; margin-top: 14px; border-top: 1px dashed var(--line); }
    .admin-project:first-of-type { padding-top: 0; margin-top: 0; border-top: 0; }
    .admin-code { color: var(--muted); font-family: var(--mono); font-size: 11px; }

    @media (max-width: 900px) {
      .admin-shell { grid-template-columns: 1fr; }
      .admin-side {
        position: relative;
        height: auto;
        padding: 18px 20px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .admin-nav { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
      .admin-nav button { min-width: 150px; }
      .admin-side-stats { display: none; }
      .admin-side-foot { flex-direction: row; gap: 16px; margin-top: 0; padding-top: 10px; }
      .admin-main { padding: 26px 20px 60px; }
      .admin-head h1 { font-size: 26px; }
      .admin-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-page="admin">
  <div class="admin-shell">
    <aside class="admin-side">
      <a class="brand" href="index.html">
        <span class="brand-mark">M</span>
        <span class="brand-text"><span data-site-title>模型手记</span><small>Content&nbsp;Admin</small></span>
      </a>

      <div class="admin-side-label">内容模块 / Modules</div>
      <nav class="admin-nav" id="adminNav">
        <button type="button" data-admin-target="site">
          <span class="admin-nav-no">01</span>
          <strong>站点信息</strong>
          <small>标题、主张与介绍</small>
        </button>
        <button type="button" data-admin-target="profile">
          <span class="admin-nav-no">02</span>
          <strong>个人信息</strong>
          <small>昵称、头像与技能</small>
        </button>
        <button type="button" data-admin-target="projects">
          <span class="admin-nav-no">03</span>
          <strong>项目</strong>
          <small>项目卡片与链接</small>
        </button>
        <button type="button" data-admin-target="posts">
          <span class="admin-nav-no">04</span>
          <strong>文章</strong>
          <small>元数据与正文</small>
        </button>
      </nav>

      <div class="admin-side-stats">
        <div><b id="adminPostCount">—</b><span>篇文章</span></div>
        <div><b id="adminProjectCount">—</b><span>个项目</span></div>
      </div>

      <div class="admin-side-foot">
        <a href="index.html">← 返回站点</a>
        <a href="https://github.com/yuchengwen393/model-notes" target="_blank" rel="noreferrer" data-site-repo>GitHub ↗</a>
        <button id="logoutBtn" type="button" hidden>退出登录</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-head">
        <div>
          <div class="eyebrow">Admin · 内容管理</div>
          <h1>站点内容后台</h1>
          <p>左侧选择模块，修改后写入 SQLite；前台刷新即可看到。</p>
        </div>
        <span class="admin-badge" id="adminBadge">未登录</span>
      </header>

      <section class="admin-card" id="loginCard">
        <h2>管理口令</h2>
        <div class="admin-grid">
          <label class="admin-field full">口令
            <input id="tokenInput" type="password" autocomplete="current-password" placeholder="输入 backend/admin_token.txt 中的口令">
          </label>
        </div>
        <div class="admin-actions">
          <button class="admin-btn" id="saveToken" type="button">验证并保存</button>
          <span class="admin-status" id="tokenStatus">未验证</span>
        </div>
      </section>

      <div class="admin-workspace" id="adminWorkspace" hidden>
        <section class="admin-card admin-panel" data-admin-panel="site" id="siteCard">
          <div class="admin-section-head">
            <h2>站点信息</h2>
            <span>同步到页头、关于页与页脚</span>
          </div>
          <form id="siteForm">
            <div class="admin-grid">
              <label class="admin-field">标题<input name="title"></label>
              <label class="admin-field">一句话主张<input name="tagline"></label>
              <label class="admin-field full">介绍段落（每行一段）<textarea name="intro"></textarea></label>
              <label class="admin-field">类型<input name="type"></label>
              <label class="admin-field">主题<input name="theme"></label>
              <label class="admin-field">时间<input name="time"></label>
              <label class="admin-field">技术<input name="tech"></label>
              <label class="admin-field">模型<input name="model"></label>
              <label class="admin-field">域名<input name="domain"></label>
              <label class="admin-field">仓库<input name="repo"></label>
            </div>
            <div class="admin-actions">
              <button class="admin-btn" type="submit">保存站点信息</button>
              <span class="admin-status" id="siteStatus"></span>
            </div>
          </form>
        </section>

        <section class="admin-card admin-panel" data-admin-panel="profile" id="profileCard" hidden>
          <div class="admin-section-head">
            <h2>个人信息</h2>
            <span>同步到关于页卡片与左侧个人卡</span>
          </div>
          <form id="profileForm">
            <div class="admin-grid">
              <label class="admin-field">昵称<input name="nickname"></label>
              <label class="admin-field">身份 / 方向<input name="role"></label>
              <label class="admin-field">邮箱<input name="email" type="email"></label>
              <label class="admin-field">所在地<input name="location"></label>
              <label class="admin-field">头像地址<input name="avatar" placeholder="favicon.svg"></label>
              <label class="admin-field">技能<input name="skills" placeholder="PyTorch / JavaScript"></label>
              <label class="admin-field full">个人简介<textarea name="bio"></textarea></label>
            </div>
            <div class="admin-actions">
              <button class="admin-btn" type="submit">保存个人信息</button>
              <span class="admin-status" id="profileStatus"></span>
            </div>
          </form>
        </section>

        <section class="admin-card admin-panel" data-admin-panel="projects" id="projectCard" hidden>
          <div class="admin-section-head">
            <h2>项目</h2>
            <span>同步到项目页与首页项目区</span>
          </div>
          <p class="admin-code">项目按顺序显示；修改后点“保存项目”。</p>
          <div id="projectList"></div>
          <div class="admin-actions">
            <button class="admin-btn ghost" id="addProject" type="button">新增项目</button>
            <span class="admin-status" id="projectStatus"></span>
          </div>
        </section>

        <section class="admin-card admin-panel" data-admin-panel="posts" id="postCard" hidden>
          <div class="admin-section-head">
            <h2>文章</h2>
            <span>同步到首页、文章列表与详情页</span>
          </div>
          <div class="admin-grid">
            <label class="admin-field">选择文章<select id="postSelect"></select></label>
            <label class="admin-field">文章 ID（新建后不可改）<input name="id" id="postId"></label>
            <label class="admin-field">标题<input name="title" id="postTitle"></label>
            <label class="admin-field">副标题<input name="subtitle" id="postSubtitle"></label>
            <label class="admin-field">日期<input name="date" id="postDate" placeholder="2026-10-29"></label>
            <label class="admin-field">标签（逗号分隔）<input name="tags" id="postTags"></label>
            <label class="admin-field">摘要<textarea name="summary" id="postSummary"></textarea></label>
            <label class="admin-field">阅读时长<input name="readingTime" id="postReadingTime" placeholder="6 min"></label>
            <label class="admin-field full">正文 Markdown<textarea class="content" name="content" id="postContent"></textarea></label>
          </div>
          <div class="admin-actions">
            <button class="admin-btn" id="savePost" type="button">保存文章</button>
            <button class="admin-btn ghost" id="newPost" type="button">新建文章</button>
            <button class="admin-btn danger" id="deletePost" type="button">删除当前文章</button>
            <span class="admin-status" id="postStatus"></span>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/blog-api.js?v=20261029b"></script>
  <script src="js/admin.js?v=20261029b"></script>
</body>
</html>
